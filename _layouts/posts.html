<!-- utterances comment -->
<script src="https://utteranc.es/client.js"
        repo="hky035/hky035.github.io"

<!--
  Related Posts는 layout: single(_layouts/single.html)이 page.related: true 기본값에 따라
  page__related.html("You may also enjoy")로 이미 렌더링한다. 여기서 같은 목록을 다시
  수동으로 그리면 entries_layout 변수가 정의된 적이 없어 class="entries-"가 되어 매칭되는
  CSS가 없는 채로 두 번 중복 출력되었다. 그래서 제거하고 Back to Top 버튼만 남긴다.
-->
<a href="#page-title" class="back-to-top" style="margin-top: 30px;">{{ site.data.ui-text[site.locale].back_to_top | default: 'Back to Top' }} &uarr;</a>

<!-- back to top 기능 추가-->
<script>
  const backToTop = document.getElementsByClassName("back-to-top")[0];
  backToTop.onclick = function(e) {
      e.preventDefault();
      window.scrollTo({
        top: 0,
        behavior: 'smooth' // 부드러운 스크롤
      });
    };
</script>
